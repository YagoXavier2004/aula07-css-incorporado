<!DOCTYPE html>
<html lang="pt-br">
<head>
<title>CS GO Pagina oficial</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f8fafc;
    color: #334155;
    line-height: 1.7;
}
header {
    background: linear-gradient(135deg, #07489e 0%, #dbab0b 100%);
    color: rgb(12, 12, 12);
    padding: 50px 20px 70px;
    text-align: center;
}
header h1 {
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 15px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
}
header > p {
    max-width: 700px;
    margin: 0 auto 10px;
    font-size: 17px;
    opacity: 0.95;
}
header img {
    border-radius: 16px;
    margin: 25px 0 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: 4px solid white;
    max-width: 100%;
}
header figure figcaption {
    font-size: 13px;
    opacity: 0.8;
    margin-bottom: 20px;
}
nav {
    background: white;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 15px;
    margin: -30px auto 0;
    max-width: 900px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    flex-wrap: wrap;
    position: relative;
    z-index: 10;
}
nav a {
    text-decoration: none;
    color: #fcc204;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 20px;
    background: #f0fdfa;
    transition: 0.3s;
}
nav a:hover {
    background: #fcc204;
    color: white;
    transform: translateY(-2px);
}
section {
    max-width: 1000px;
    margin: 40px auto;
    background: white;
    border-radius: 16px;
    padding: 35px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    overflow: hidden;
}
section > img {
    width: 100%;
    max-width: 380px;
    border-radius: 12px;
    float: left;
    margin: 0 25px 15px 0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
section figcaption {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 15px;
    font-style: italic;
}
section h2 {
    color: #fcc204;
    font-size: 28px;
    margin-bottom: 20px;
    border-left: 5px solid #fcc204;
    padding-left: 15px;
}
section h3 {
    color: #fcc204;
    margin: 25px 0 10px;
    font-size: 18px;
}
#Gastronomia ul {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 20px;
}
#Gastronomia li {
    background: #f8fafc;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    transition: 0.3s;
}
#Gastronomia li:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}
#Gastronomia li p {
    font-size: 14px;
    margin-top: 8px;
    color: #475569;
}
aside {
    max-width: 1000px;
    margin: 0 auto 40px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
}
aside h2 { color: #fcc204; margin-bottom: 10px; font-size: 22px; }
aside a {
    display: inline-block;
    margin-top: 12px;
    background: #fcc204;
    color: white;
    padding: 10px 22px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}
aside a:hover { background: #fcc204; }
.footer-imoveis {
    background: #111827;
    color: #d1d5db;
    padding: 40px 20px;
    margin-top: 50px;
}
.footer-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}
.footer-left h3 { color: #fff; margin: 0 0 5px 0; font-size: 18px; }
.footer-left span { color: #14b8a6; font-size: 13px; font-weight: 600; text-transform: uppercase; }
.footer-left p { margin: 15px 0 0 0; font-size: 13px; line-height: 1.6; color: #9ca3af; }
.footer-left b { color: #fff; }
.footer-right { text-align: right; }
.footer-right p { margin: 0 0 15px 0; font-size: 13px; }
.btn-topo {
    display: inline-block;
    background: #14b8a6;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    transition: 0.3s;
}
.btn-topo:hover { background: #fff; color: #111827; transform: translateY(-2px); }
@media(max-width: 768px){
    header h1 { font-size: 30px; }
    section > img { float: none; margin: 0 0 15px 0; max-width: 100%; }
    section { padding: 20px; margin: 20px 15px; }
    nav { margin: 20px 15px 0; }
    .footer-container { flex-direction: column; text-align: center; }
    .footer-right { text-align: center; }
}


</style>
</head>
<body >
    <header>
        <h1>Couter-strike 2</h1>
        <p>A era do CS GO chegou!</p>

        <img src="imagens/capa-do-jogo.jpg" 
        alt="dois bonecos de um jogo de fps com ambos armados">
        <br>
        <br>
      <nav>

        <a href="#loja">loja</a>
        <a href="#noticias">Principais noticias</a>
        <a href="#dicas">Dicas para iniciantes</a>
        <a href="#promocoes">Promoções</a>
        <a href="#comunidade">Canais da comunidade</a>
      </nav>
    </header>
